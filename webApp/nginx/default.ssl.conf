server {
    listen 80;
    server_name windwindwind-alicia.cn www.windwindwind-alicia.cn;
    client_max_body_size 1024m;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name windwindwind-alicia.cn www.windwindwind-alicia.cn;
    client_max_body_size 1024m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 308 /cloudPan/;
    }

    location = /login {
        return 308 /cloudPan$request_uri;
    }

    location = /app-download {
        return 308 /cloudPan$request_uri;
    }

    location ~ ^/share/.+ {
        return 308 /cloudPan$request_uri;
    }

    location /assets/ {
        return 308 /cloudPan$request_uri;
    }

    location = /favicon-32.png {
        return 308 /cloudPan/favicon-32.png;
    }

    location = /apple-touch-icon.png {
        return 308 /cloudPan/apple-touch-icon.png;
    }

    location = /login-bg.png {
        return 308 /cloudPan/login-bg.png;
    }

    location = /cloudPan {
        return 308 /cloudPan/;
    }

    location = /cloudPan/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /cloudPan/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /rag {
        return 308 /rag/;
    }

    location ^~ /rag/internal/ {
        return 404;
    }

    location /rag/ {
        proxy_pass http://rag:8081/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /rag;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
    }

    location ^~ /cloudPan/ {
        try_files $uri $uri/ /cloudPan/index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
