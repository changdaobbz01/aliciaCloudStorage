server {
    listen 80;
    server_name windwindwind-alicia.cn www.windwindwind-alicia.cn;
    client_max_body_size 1024m;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name windwindwind-alicia.cn www.windwindwind-alicia.cn;
    client_max_body_size 1024m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $main_site_upstream http://main-site:80;
    set $api_upstream http://api:8080;
    set $identity_upstream http://identity:8082;
    set $rag_upstream http://rag:8081;

    location = /cloudPan {
        return 308 /cloudPan/;
    }

    location = /cloudPan/login {
        return 308 /login?returnTo=/cloudPan/;
    }

    location = /cloudPan/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /cloudPan/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /console/cloud {
        return 308 /console/cloud/;
    }

    location = /console/cloud/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /console/cloud/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /rag {
        return 308 /rag/;
    }

    location ^~ /rag/internal/ {
        return 404;
    }

    location /rag/ {
        rewrite ^/rag/?(.*)$ /$1 break;
        proxy_pass $rag_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /rag;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
    }

    location ^~ /cloudPan/ {
        try_files $uri $uri/ /cloudPan/index.html;
    }

    location ^~ /console/cloud/ {
        try_files $uri $uri/ /console/cloud/index.html;
    }

    location ~ ^/api/identity/(health(?:/dependencies)?$|\.well-known/jwks\.json$|auth/|admin/) {
        proxy_pass $identity_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/identity/ {
        return 404;
    }

    location / {
        proxy_pass $main_site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
