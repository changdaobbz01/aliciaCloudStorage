spring.application.name=rag-execution-service
server.port=${SERVER_PORT:8084}
server.forward-headers-strategy=framework
server.shutdown=graceful

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/alicia_rag_execution?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${ALICIA_RAG_EXECUTION_DB_USERNAME:alicia_rag_execution}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${ALICIA_RAG_EXECUTION_DB_PASSWORD:CHANGE_ME}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

alicia.rag-execution.features.enabled=${ALICIA_RAG_EXECUTION_ENABLED:false}
alicia.rag-execution.features.registration-enabled=${ALICIA_RAG_EXECUTION_REGISTRATION_ENABLED:false}
alicia.rag-execution.features.public-confirm-enabled=${ALICIA_RAG_EXECUTION_PUBLIC_CONFIRM_ENABLED:false}
alicia.rag-execution.features.worker-enabled=${ALICIA_RAG_EXECUTION_WORKER_ENABLED:false}
alicia.rag-execution.features.cloud-dispatch-enabled=${ALICIA_RAG_EXECUTION_CLOUD_DISPATCH_ENABLED:false}
alicia.rag-execution.features.admin-only=${ALICIA_RAG_EXECUTION_ADMIN_ONLY:true}
alicia.rag-execution.features.allowed-actions=${ALICIA_RAG_EXECUTION_ALLOWED_ACTIONS:}

alicia.rag-execution.security.service-secret=${ALICIA_RAG_EXECUTION_SERVICE_SECRET:}
alicia.rag-execution.security.maximum-clock-skew=${ALICIA_RAG_EXECUTION_MAXIMUM_CLOCK_SKEW:60s}
alicia.rag-execution.security.nonce-ttl=${ALICIA_RAG_EXECUTION_NONCE_TTL:3m}

alicia.rag-execution.identity-api.base-url=${ALICIA_RAG_EXECUTION_IDENTITY_API_BASE_URL:http://localhost:8093}
alicia.rag-execution.identity-api.connect-timeout=${ALICIA_RAG_EXECUTION_IDENTITY_CONNECT_TIMEOUT:2s}
alicia.rag-execution.identity-api.read-timeout=${ALICIA_RAG_EXECUTION_IDENTITY_READ_TIMEOUT:5s}

alicia.rag-execution.cloud-api.base-url=${ALICIA_RAG_EXECUTION_CLOUD_API_BASE_URL:http://localhost:8080}
alicia.rag-execution.cloud-api.service-secret=${ALICIA_RAG_EXECUTION_CLOUD_SERVICE_SECRET:}
alicia.rag-execution.cloud-api.connect-timeout=${ALICIA_RAG_EXECUTION_CLOUD_CONNECT_TIMEOUT:2s}
alicia.rag-execution.cloud-api.read-timeout=${ALICIA_RAG_EXECUTION_CLOUD_READ_TIMEOUT:5s}

alicia.rag-execution.limits.max-steps=${ALICIA_RAG_EXECUTION_MAX_STEPS:10}
alicia.rag-execution.limits.max-batch-nodes=${ALICIA_RAG_EXECUTION_MAX_BATCH_NODES:100}
alicia.rag-execution.limits.max-plan-bytes=${ALICIA_RAG_EXECUTION_MAX_PLAN_BYTES:65536}
alicia.rag-execution.limits.confirmation-ttl=${ALICIA_RAG_EXECUTION_CONFIRMATION_TTL:10m}
alicia.rag-execution.limits.max-queue-wait=${ALICIA_RAG_EXECUTION_MAX_QUEUE_WAIT:2m}
alicia.rag-execution.limits.client-input-ttl=${ALICIA_RAG_EXECUTION_CLIENT_INPUT_TTL:15m}
alicia.rag-execution.limits.lease-duration=${ALICIA_RAG_EXECUTION_LEASE_DURATION:30s}
alicia.rag-execution.limits.max-attempts=${ALICIA_RAG_EXECUTION_MAX_ATTEMPTS:3}

alicia.rag-execution.worker.poll-delay=${ALICIA_RAG_EXECUTION_WORKER_POLL_DELAY:1s}
alicia.rag-execution.worker.stream-timeout=${ALICIA_RAG_EXECUTION_STREAM_TIMEOUT:30s}
alicia.rag-execution.worker.stream-poll-interval=${ALICIA_RAG_EXECUTION_STREAM_POLL_INTERVAL:500ms}
