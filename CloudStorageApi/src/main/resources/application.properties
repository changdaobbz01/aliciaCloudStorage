spring.application.name=cloud-storage-api
server.port=8080
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alicia_cloud_storage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

alicia.auth.token-secret=${ALICIA_AUTH_TOKEN_SECRET:alicia-cloud-storage-dev-secret-change-me}
alicia.auth.token-expire-seconds=${ALICIA_AUTH_TOKEN_EXPIRE_SECONDS:604800}
alicia.share.max-expanded-nodes=${ALICIA_SHARE_MAX_EXPANDED_NODES:5000}
alicia.cos.secret-id=${ALICIA_COS_SECRET_ID:}
alicia.cos.secret-key=${ALICIA_COS_SECRET_KEY:}
alicia.cos.region=${ALICIA_COS_REGION:ap-shanghai}
alicia.cos.bucket=${ALICIA_COS_BUCKET:}
alicia.cos.custom-domain=${ALICIA_COS_CUSTOM_DOMAIN:}
alicia.cos.max-file-size-bytes=${ALICIA_COS_MAX_FILE_SIZE_BYTES:1073741824}
alicia.storage.total-space-bytes=${ALICIA_STORAGE_TOTAL_SPACE_BYTES:1099511627776}
alicia.storage.default-user-quota-bytes=${ALICIA_STORAGE_DEFAULT_USER_QUOTA_BYTES:53687091200}
alicia.storage.ai-trash.max-selected-nodes=${ALICIA_STORAGE_AI_TRASH_MAX_SELECTED_NODES:500}
alicia.storage.ai-trash.max-impact-nodes=${ALICIA_STORAGE_AI_TRASH_MAX_IMPACT_NODES:2000}
alicia.app-package.storage-dir=${ALICIA_APP_PACKAGE_STORAGE_DIR:/app/data/app-package}
alicia.app-package.max-size-bytes=${ALICIA_APP_PACKAGE_MAX_SIZE_BYTES:314572800}
alicia.app-package.cos-prefix=${ALICIA_APP_PACKAGE_COS_PREFIX:app-packages}
alicia.app-package.download-url-expire-seconds=${ALICIA_APP_PACKAGE_DOWNLOAD_URL_EXPIRE_SECONDS:1800}
alicia.bootstrap-admin.phone=${ALICIA_BOOTSTRAP_ADMIN_PHONE:}
alicia.bootstrap-admin.password=${ALICIA_BOOTSTRAP_ADMIN_PASSWORD:}
alicia.bootstrap-admin.nickname=${ALICIA_BOOTSTRAP_ADMIN_NICKNAME:}
alicia.bootstrap-admin.avatar-url=${ALICIA_BOOTSTRAP_ADMIN_AVATAR_URL:}
alicia.multipart-upload.cleanup-enabled=${ALICIA_MULTIPART_UPLOAD_CLEANUP_ENABLED:true}
alicia.multipart-upload.stale-hours=${ALICIA_MULTIPART_UPLOAD_STALE_HOURS:24}
alicia.multipart-upload.cleanup-fixed-delay-ms=${ALICIA_MULTIPART_UPLOAD_CLEANUP_FIXED_DELAY_MS:3600000}
alicia.multipart-upload.cleanup-initial-delay-ms=${ALICIA_MULTIPART_UPLOAD_CLEANUP_INITIAL_DELAY_MS:300000}
alicia.storage-events.webhook.url=${ALICIA_STORAGE_EVENTS_WEBHOOK_URL:}
alicia.storage-events.webhook.secret=${ALICIA_STORAGE_EVENTS_WEBHOOK_SECRET:}
alicia.storage-events.webhook.connect-timeout-ms=${ALICIA_STORAGE_EVENTS_WEBHOOK_CONNECT_TIMEOUT_MS:2000}
alicia.storage-events.webhook.request-timeout-ms=${ALICIA_STORAGE_EVENTS_WEBHOOK_REQUEST_TIMEOUT_MS:5000}
