spring.application.name=rag-service
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mvc.async.request-timeout=60s
alicia.rag.stream.heartbeat-millis=${ALICIA_RAG_STREAM_HEARTBEAT_MILLIS:3000}
alicia.rag.stream.timeout-millis=${ALICIA_RAG_STREAM_TIMEOUT_MILLIS:60000}
alicia.rag.stream.plan-timeout-millis=${ALICIA_RAG_STREAM_PLAN_TIMEOUT_MILLIS:35000}

alicia.rag.webhook-secret=${ALICIA_RAG_WEBHOOK_SECRET:}
alicia.rag.deepseek.api-key=${DEEPSEEK_API_KEY:}
alicia.rag.conversation.ttl-minutes=${ALICIA_RAG_CONVERSATION_TTL_MINUTES:30}
alicia.rag.conversation.max-conversations=${ALICIA_RAG_CONVERSATION_MAX_CONVERSATIONS:500}
alicia.rag.storage-api.base-url=${ALICIA_STORAGE_API_BASE_URL:}
alicia.rag.storage-api.timeout-seconds=${ALICIA_STORAGE_API_TIMEOUT_SECONDS:4}
alicia.rag.candidate-binding.max-results=${ALICIA_RAG_CANDIDATE_BINDING_MAX_RESULTS:5}
alicia.rag.collection-preview.max-items=${ALICIA_RAG_COLLECTION_PREVIEW_MAX_ITEMS:20}
alicia.rag.collection-preview.max-scan-items=${ALICIA_RAG_COLLECTION_PREVIEW_MAX_SCAN_ITEMS:500}
alicia.rag.collection-snapshot.ttl-minutes=${ALICIA_RAG_COLLECTION_SNAPSHOT_TTL_MINUTES:30}
alicia.rag.collection-snapshot.max-snapshots=${ALICIA_RAG_COLLECTION_SNAPSHOT_MAX_ENTRIES:1000}
