spring.application.name=identity-api
server.port=${SERVER_PORT:8082}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alicia_cloud_storage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/identity-migration
spring.flyway.table=identity_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Identity schema baseline
alicia.auth.token-secret=${ALICIA_AUTH_TOKEN_SECRET:alicia-cloud-storage-dev-secret-change-me}
alicia.auth.token-expire-seconds=${ALICIA_AUTH_TOKEN_EXPIRE_SECONDS:604800}
alicia.mail.enabled=${ALICIA_MAIL_ENABLED:false}
alicia.mail.smtp-host=${ALICIA_MAIL_SMTP_HOST:smtp.qcloudmail.com}
alicia.mail.smtp-port=${ALICIA_MAIL_SMTP_PORT:465}
alicia.mail.smtp-username=${ALICIA_MAIL_SMTP_USERNAME:}
alicia.mail.smtp-password=${ALICIA_MAIL_SMTP_PASSWORD:}
alicia.mail.from-address=${ALICIA_MAIL_FROM_ADDRESS:}
alicia.mail.from-name=${ALICIA_MAIL_FROM_NAME:Alicia Cloud}
alicia.mail.ssl-enabled=${ALICIA_MAIL_SSL_ENABLED:true}
alicia.bootstrap-admin.phone=${ALICIA_BOOTSTRAP_ADMIN_PHONE:}
alicia.bootstrap-admin.password=${ALICIA_BOOTSTRAP_ADMIN_PASSWORD:}
alicia.bootstrap-admin.nickname=${ALICIA_BOOTSTRAP_ADMIN_NICKNAME:}
alicia.bootstrap-admin.avatar-url=${ALICIA_BOOTSTRAP_ADMIN_AVATAR_URL:}
