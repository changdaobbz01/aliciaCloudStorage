<svg xmlns="http://www.w3.org/2000/svg" width="1179" height="2487" viewBox="0 0 1179 2487">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071120"/>
      <stop offset="1" stop-color="#111B2B"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FF"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48D5FF"/>
      <stop offset="1" stop-color="#1E63FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#020915" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="117" height="180" patternUnits="userSpaceOnUse">
      <path d="M117 0V180M0 180H117" fill="none" stroke="#48D5FF" stroke-opacity="0.08" stroke-width="3"/>
    </pattern>
    <style>
      .label{font-family:Arial,'Microsoft YaHei',sans-serif;font-weight:800;fill:#101626}
      .muted{font-family:Arial,'Microsoft YaHei',sans-serif;font-weight:600;fill:#748094}
      .white{font-family:Arial,'Microsoft YaHei',sans-serif;font-weight:900;fill:#FFFFFF}
      .blue{fill:#1E63FF}
      .cyan{stroke:#48D5FF}
      .orange{stroke:#FF9D24}
      .stroke{stroke:#D7E3F4;stroke-width:4}
      .thin{stroke-width:4;stroke-linecap:round;fill:none}
    </style>
  </defs>

  <rect width="1179" height="2487" fill="url(#bg)"/>
  <rect width="1179" height="2487" fill="url(#grid)"/>
  <path d="M890 0l192 288M0 2060l126-168" stroke="#48D5FF" stroke-opacity="0.32" stroke-width="4" fill="none"/>
  <text x="72" y="102" class="white" font-size="42">Alicia mecha UI vector kit</text>
  <text x="72" y="152" fill="#8FA8CC" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28">393 x 829 dp baseline, 3x asset sheet</text>

  <!-- Hero crop frame -->
  <g transform="translate(48 220)" filter="url(#shadow)">
    <path d="M0 0H1083V558H0Z" rx="84" fill="#0B1830" stroke="#29456F" stroke-width="5"/>
    <path d="M48 60H246l42 42h507l42-42h198" fill="none" stroke="#48D5FF" stroke-opacity="0.45" stroke-width="5"/>
    <text x="54" y="156" class="white" font-size="84">Alicia 云盘</text>
    <rect x="60" y="188" width="315" height="9" fill="url(#bluePanel)" rx="5"/>
    <circle cx="963" cy="126" r="75" fill="url(#bluePanel)" stroke="#FFFFFF" stroke-width="12"/>
    <path d="M132 420l72-90h120l54 54h282l54-54h144l84 90" fill="none" stroke="#48D5FF" stroke-opacity="0.28" stroke-width="6"/>
    <text x="54" y="504" fill="#8FA8CC" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30">Use PNG header image in app; this frame locks crop, title and radar avatar placement.</text>
  </g>

  <!-- Search bar -->
  <g transform="translate(48 828)" filter="url(#shadow)">
    <rect x="0" y="0" width="1083" height="168" rx="84" fill="url(#armor)" class="stroke"/>
    <path d="M120 84H800" stroke="#D7E3F4" stroke-width="4"/>
    <text x="884" y="104" class="label" font-size="48" fill="#1E63FF">搜索</text>
  </g>

  <!-- Main armor panel -->
  <g transform="translate(48 1044)" filter="url(#shadow)">
    <path d="M54 0H459L510 45H573L624 0H1029L1083 54V342L1029 396H54L0 342V54Z" fill="url(#armor)" class="stroke"/>
    <path d="M72 72l45-45M966 27l45 45M72 324l45 45M966 369l45-45" class="thin cyan"/>
    <rect x="54" y="54" width="252" height="75" rx="38" fill="#EAF2FF" stroke="#BCD0EE" stroke-width="4"/>
    <text x="90" y="105" class="label" font-size="38" fill="#1E63FF">管理员空间</text>
    <text x="780" y="120" class="label" font-size="54">系统管理员</text>
    <rect x="54" y="174" width="975" height="162" rx="81" fill="#FFFFFF" stroke="#CEDCF0" stroke-width="4"/>
    <circle cx="135" cy="255" r="51" fill="#EAF2FF" stroke="#D7E3F4" stroke-width="4"/>
    <path d="M102 264c0-27 18-45 42-45 17 0 31 8 39 22 20 0 36 16 36 36 0 21-17 38-39 38h-72c-20 0-36-16-36-36 0-17 12-31 30-35z" fill="none" stroke="#1E63FF" stroke-width="12" stroke-linejoin="round"/>
    <text x="216" y="248" class="label" font-size="42">云端空间运行正常</text>
    <text x="216" y="300" class="muted" font-size="34">147 KB / 无限制</text>
    <rect x="786" y="204" width="207" height="102" rx="51" fill="#EAF2FF" stroke="#83A8E8" stroke-width="5"/>
    <text x="843" y="269" class="label" font-size="38" fill="#1E63FF">查看文件</text>
  </g>

  <!-- Quick action tiles -->
  <g transform="translate(48 1492)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="246" height="336" rx="48" fill="url(#armor)" class="stroke"/>
      <path d="M36 54l42-42M168 12l42 42M36 282l42 42M168 324l42-42" class="thin cyan"/>
      <rect x="72" y="63" width="102" height="102" rx="51" fill="#EAF2FF" stroke="#D7E3F4" stroke-width="5"/>
      <path d="M90 118h72v48H90zM90 105h33l12 13" fill="none" stroke="#1E63FF" stroke-width="12" stroke-linejoin="round"/>
      <text x="123" y="226" text-anchor="middle" class="label" font-size="34">全部文件</text>
      <text x="123" y="294" text-anchor="middle" class="muted" font-size="28">浏览目录</text>
    </g>
    <g transform="translate(279 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="246" height="336" rx="48" fill="url(#armor)" class="stroke"/>
      <path d="M36 54l42-42M168 12l42 42M36 282l42 42M168 324l42-42" class="thin cyan"/>
      <rect x="72" y="63" width="102" height="102" rx="51" fill="#EAF2FF" stroke="#D7E3F4" stroke-width="5"/>
      <path d="M123 144V84M96 111l27-27 27 27M93 153h60v18H93z" fill="none" stroke="#1E63FF" stroke-width="12" stroke-linejoin="round"/>
      <text x="123" y="226" text-anchor="middle" class="label" font-size="34">上传文件</text>
      <text x="123" y="294" text-anchor="middle" class="muted" font-size="28">快速入库</text>
    </g>
    <g transform="translate(558 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="246" height="336" rx="48" fill="url(#armor)" class="stroke"/>
      <path d="M36 54l42-42M168 12l42 42M36 282l42 42M168 324l42-42" class="thin cyan"/>
      <rect x="72" y="63" width="102" height="102" rx="51" fill="#EAF2FF" stroke="#D7E3F4" stroke-width="5"/>
      <path d="M96 102h54M108 102v-18h30v18M105 120h42v51h-42z" fill="none" stroke="#1E63FF" stroke-width="12" stroke-linejoin="round"/>
      <text x="123" y="226" text-anchor="middle" class="label" font-size="34">回收站</text>
      <text x="123" y="294" text-anchor="middle" class="muted" font-size="28">恢复删除</text>
    </g>
    <g transform="translate(837 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="246" height="336" rx="48" fill="url(#armor)" class="stroke"/>
      <path d="M36 54l42-42M168 12l42 42M36 282l42 42M168 324l42-42" class="thin cyan"/>
      <rect x="72" y="63" width="102" height="102" rx="51" fill="#EAF2FF" stroke="#D7E3F4" stroke-width="5"/>
      <circle cx="111" cy="105" r="21" fill="none" stroke="#1E63FF" stroke-width="12"/>
      <path d="M78 165c6-27 24-42 51-42 14 0 26 4 35 12M168 144l18-10 18 10v21l-18 10-18-10z" fill="none" stroke="#1E63FF" stroke-width="10" stroke-linejoin="round"/>
      <text x="123" y="226" text-anchor="middle" class="label" font-size="34">账号管理</text>
      <text x="123" y="294" text-anchor="middle" class="muted" font-size="28">仅管理员</text>
    </g>
  </g>

  <!-- Metrics and trend -->
  <g transform="translate(48 1888)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="517" height="252" rx="45" fill="url(#armor)" class="stroke"/>
      <path d="M36 54l42-42M439 12l42 42M36 198l42 42M439 240l42-42" class="thin cyan"/>
      <text x="42" y="78" class="muted" font-size="36">总项目</text>
      <text x="42" y="174" class="label" font-size="72">7</text>
    </g>
    <g transform="translate(566 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="517" height="252" rx="45" fill="url(#armor)" class="stroke"/>
      <path d="M36 54l42-42M439 12l42 42M36 198l42 42M439 240l42-42" class="thin orange"/>
      <text x="42" y="78" class="muted" font-size="36">文件夹</text>
      <text x="42" y="174" class="label" font-size="72">6</text>
    </g>
    <g transform="translate(0 312)" filter="url(#shadow)">
      <path d="M54 0H480L525 45H558L603 0H1029L1083 54V246L1029 300H54L0 246V54Z" fill="url(#armor)" class="stroke"/>
      <path d="M72 72l45-45M966 27l45 45M72 228l45 45M966 273l45-45" class="thin cyan"/>
      <text x="54" y="93" class="label" font-size="52">空间趋势</text>
      <text x="54" y="201" class="label" font-size="70">147 KB / 无限制</text>
      <rect x="705" y="66" width="306" height="150" rx="45" fill="#EAF2FF"/>
      <path d="M735 177l60-3 42-75 72 6 72-51" fill="none" stroke="#1E63FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="735" cy="177" r="14" fill="#FFFFFF" stroke="#1E63FF" stroke-width="7"/>
      <circle cx="795" cy="174" r="14" fill="#FFFFFF" stroke="#1E63FF" stroke-width="7"/>
      <circle cx="837" cy="99" r="14" fill="#FFFFFF" stroke="#1E63FF" stroke-width="7"/>
      <circle cx="909" cy="105" r="14" fill="#FFFFFF" stroke="#1E63FF" stroke-width="7"/>
      <circle cx="981" cy="54" r="14" fill="#FFFFFF" stroke="#1E63FF" stroke-width="7"/>
    </g>
  </g>

  <!-- Bottom cockpit navigation -->
  <g transform="translate(48 2260)" filter="url(#shadow)">
    <path d="M54 0H426L489 54H594L657 0H1029L1083 54V183L1029 237H54L0 183V54Z" fill="url(#armor)" class="stroke"/>
    <rect x="102" y="0" width="879" height="15" rx="8" fill="#071120"/>
    <path d="M78 57l45-45M960 12l45 45" class="thin orange"/>
    <text x="195" y="165" text-anchor="middle" class="label" font-size="36" fill="#1E63FF">首页</text>
    <text x="888" y="165" text-anchor="middle" class="muted" font-size="36">文件</text>
    <g transform="translate(429 -36)">
      <rect x="0" y="0" width="225" height="174" rx="54" fill="#F8FBFF" stroke="#D6E0F0" stroke-width="9"/>
      <rect x="24" y="24" width="177" height="126" rx="42" fill="#1E63FF"/>
      <text x="112" y="108" text-anchor="middle" class="white" font-size="36">账号</text>
    </g>
  </g>
</svg>
