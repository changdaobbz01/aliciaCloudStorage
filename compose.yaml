services:
  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      ALICIA_IDENTITY_MYSQL_DATABASE: ${ALICIA_IDENTITY_MYSQL_DATABASE:-}
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - alicia_cloud_storage_mysql_data:/var/lib/mysql
      - ./deploy/mysql/init-identity-database.sh:/docker-entrypoint-initdb.d/10-init-identity-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rag-execution-db-init:
    image: mysql:8.0
    restart: "no"
    profiles: ["rag-execution-foundation"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      ALICIA_IDENTITY_MYSQL_DATABASE: ${ALICIA_IDENTITY_MYSQL_DATABASE:-}
      ALICIA_RAG_EXECUTION_MYSQL_DATABASE: ${ALICIA_RAG_EXECUTION_MYSQL_DATABASE:-alicia_rag_execution}
      ALICIA_RAG_EXECUTION_DB_USERNAME: ${ALICIA_RAG_EXECUTION_DB_USERNAME:-alicia_rag_execution}
      ALICIA_RAG_EXECUTION_DB_PASSWORD: ${ALICIA_RAG_EXECUTION_DB_PASSWORD:-CHANGE_ME}
    volumes:
      - ./deploy/mysql/ensure-rag-execution-database.sh:/opt/alicia/ensure-rag-execution-database.sh:ro
    entrypoint: ["bash", "/opt/alicia/ensure-rag-execution-database.sh"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: CloudStorageApi/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ALICIA_IDENTITY_API_BASE_URL: ${ALICIA_IDENTITY_API_BASE_URL:-http://identity:8082}
      ALICIA_AUTH_TOKEN_ISSUER: ${ALICIA_AUTH_TOKEN_ISSUER:-https://windwindwind-alicia.cn}
      ALICIA_AUTH_TOKEN_AUDIENCE: ${ALICIA_AUTH_TOKEN_AUDIENCE:-alicia-tools}
      ALICIA_IDENTITY_TOKEN_PREFLIGHT_ENABLED: ${ALICIA_IDENTITY_TOKEN_PREFLIGHT_ENABLED:-true}
      ALICIA_IDENTITY_TOKEN_JWKS_CACHE_SECONDS: ${ALICIA_IDENTITY_TOKEN_JWKS_CACHE_SECONDS:-300}
      ALICIA_IDENTITY_CURRENT_USER_CACHE_ENABLED: ${ALICIA_IDENTITY_CURRENT_USER_CACHE_ENABLED:-true}
      ALICIA_IDENTITY_CURRENT_USER_CACHE_TTL_SECONDS: ${ALICIA_IDENTITY_CURRENT_USER_CACHE_TTL_SECONDS:-3}
      ALICIA_IDENTITY_CURRENT_USER_CACHE_MAX_ENTRIES: ${ALICIA_IDENTITY_CURRENT_USER_CACHE_MAX_ENTRIES:-1024}
      ALICIA_RAG_EXECUTION_CLOUD_ACTIONS_ENABLED: ${ALICIA_RAG_EXECUTION_CLOUD_ACTIONS_ENABLED:-false}
      ALICIA_RAG_EXECUTION_CLOUD_SERVICE_SECRET: ${ALICIA_RAG_EXECUTION_CLOUD_SERVICE_SECRET:-}
      ALICIA_RAG_EXECUTION_CLOUD_MAXIMUM_CLOCK_SKEW: ${ALICIA_RAG_EXECUTION_CLOUD_MAXIMUM_CLOCK_SKEW:-60s}
      ALICIA_RAG_EXECUTION_CLOUD_NONCE_TTL: ${ALICIA_RAG_EXECUTION_CLOUD_NONCE_TTL:-3m}
      ALICIA_RAG_EXECUTION_CLOUD_REQUEST_MAX_AGE: ${ALICIA_RAG_EXECUTION_CLOUD_REQUEST_MAX_AGE:-2m}
      ALICIA_RAG_EXECUTION_CLOUD_MAX_REQUEST_BYTES: ${ALICIA_RAG_EXECUTION_CLOUD_MAX_REQUEST_BYTES:-65536}
      ALICIA_SHARE_ACCESS_TOKEN_SECRET: ${ALICIA_SHARE_ACCESS_TOKEN_SECRET:-${ALICIA_AUTH_TOKEN_SECRET:-alicia-cloud-storage-dev-secret-change-me}}
      ALICIA_COS_SECRET_ID: ${ALICIA_COS_SECRET_ID}
      ALICIA_COS_SECRET_KEY: ${ALICIA_COS_SECRET_KEY}
      ALICIA_COS_REGION: ${ALICIA_COS_REGION}
      ALICIA_COS_BUCKET: ${ALICIA_COS_BUCKET}
      ALICIA_COS_CUSTOM_DOMAIN: ${ALICIA_COS_CUSTOM_DOMAIN:-}
      ALICIA_COS_MAX_FILE_SIZE_BYTES: ${ALICIA_COS_MAX_FILE_SIZE_BYTES}
      ALICIA_STORAGE_TOTAL_SPACE_BYTES: ${ALICIA_STORAGE_TOTAL_SPACE_BYTES}
      ALICIA_STORAGE_DEFAULT_USER_QUOTA_BYTES: ${ALICIA_STORAGE_DEFAULT_USER_QUOTA_BYTES}
      ALICIA_APP_PACKAGE_STORAGE_DIR: ${ALICIA_APP_PACKAGE_STORAGE_DIR:-/app/data/app-package}
      ALICIA_APP_PACKAGE_MAX_SIZE_BYTES: ${ALICIA_APP_PACKAGE_MAX_SIZE_BYTES:-314572800}
      ALICIA_APP_PACKAGE_COS_PREFIX: ${ALICIA_APP_PACKAGE_COS_PREFIX:-app-packages}
      ALICIA_APP_PACKAGE_DOWNLOAD_URL_EXPIRE_SECONDS: ${ALICIA_APP_PACKAGE_DOWNLOAD_URL_EXPIRE_SECONDS:-1800}
      ALICIA_CLOUD_OBJECT_CLEANUP_ENABLED: ${ALICIA_CLOUD_OBJECT_CLEANUP_ENABLED:-true}
      ALICIA_CLOUD_OBJECT_CLEANUP_BATCH_SIZE: ${ALICIA_CLOUD_OBJECT_CLEANUP_BATCH_SIZE:-100}
      ALICIA_CLOUD_OBJECT_CLEANUP_MAX_ATTEMPTS: ${ALICIA_CLOUD_OBJECT_CLEANUP_MAX_ATTEMPTS:-8}
      ALICIA_CLOUD_OBJECT_CLEANUP_RETRY_BASE_DELAY_SECONDS: ${ALICIA_CLOUD_OBJECT_CLEANUP_RETRY_BASE_DELAY_SECONDS:-300}
      ALICIA_CLOUD_OBJECT_CLEANUP_RETRY_MAX_DELAY_SECONDS: ${ALICIA_CLOUD_OBJECT_CLEANUP_RETRY_MAX_DELAY_SECONDS:-86400}
      ALICIA_CLOUD_OBJECT_CLEANUP_RETRY_FIXED_DELAY_MS: ${ALICIA_CLOUD_OBJECT_CLEANUP_RETRY_FIXED_DELAY_MS:-300000}
      ALICIA_CLOUD_OBJECT_CLEANUP_RETRY_INITIAL_DELAY_MS: ${ALICIA_CLOUD_OBJECT_CLEANUP_RETRY_INITIAL_DELAY_MS:-60000}
      ALICIA_STORAGE_EVENTS_WEBHOOK_URL: ${ALICIA_STORAGE_EVENTS_WEBHOOK_URL:-}
      ALICIA_STORAGE_EVENTS_WEBHOOK_SECRET: ${ALICIA_STORAGE_EVENTS_WEBHOOK_SECRET:-}
      ALICIA_STORAGE_EVENTS_WEBHOOK_CONNECT_TIMEOUT_MS: ${ALICIA_STORAGE_EVENTS_WEBHOOK_CONNECT_TIMEOUT_MS:-2000}
      ALICIA_STORAGE_EVENTS_WEBHOOK_REQUEST_TIMEOUT_MS: ${ALICIA_STORAGE_EVENTS_WEBHOOK_REQUEST_TIMEOUT_MS:-5000}
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - alicia_cloud_storage_app_package_data:/app/data/app-package
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      ALICIA_RAG_WEBHOOK_SECRET: ${ALICIA_RAG_WEBHOOK_SECRET:-}
      ALICIA_STORAGE_API_BASE_URL: ${ALICIA_STORAGE_API_BASE_URL:-http://api:8080}
      ALICIA_STORAGE_API_TIMEOUT_SECONDS: ${ALICIA_STORAGE_API_TIMEOUT_SECONDS:-4}
      ALICIA_RAG_IDENTITY_API_BASE_URL: ${ALICIA_RAG_IDENTITY_API_BASE_URL:-http://identity:8082}
      ALICIA_RAG_IDENTITY_API_CONNECT_TIMEOUT_MS: ${ALICIA_RAG_IDENTITY_API_CONNECT_TIMEOUT_MS:-2000}
      ALICIA_RAG_IDENTITY_API_READ_TIMEOUT_MS: ${ALICIA_RAG_IDENTITY_API_READ_TIMEOUT_MS:-5000}
      ALICIA_RAG_CANDIDATE_BINDING_MAX_RESULTS: ${ALICIA_RAG_CANDIDATE_BINDING_MAX_RESULTS:-5}
      ALICIA_RAG_CANDIDATE_BINDING_DIRECTORY_LIST_MAX_RESULTS: ${ALICIA_RAG_CANDIDATE_BINDING_DIRECTORY_LIST_MAX_RESULTS:-50}
      ALICIA_RAG_COLLECTION_PREVIEW_MAX_ITEMS: ${ALICIA_RAG_COLLECTION_PREVIEW_MAX_ITEMS:-20}
      ALICIA_RAG_COLLECTION_PREVIEW_MAX_SCAN_ITEMS: ${ALICIA_RAG_COLLECTION_PREVIEW_MAX_SCAN_ITEMS:-500}
      ALICIA_RAG_COLLECTION_SNAPSHOT_TTL_MINUTES: ${ALICIA_RAG_COLLECTION_SNAPSHOT_TTL_MINUTES:-30}
      ALICIA_RAG_COLLECTION_SNAPSHOT_MAX_ENTRIES: ${ALICIA_RAG_COLLECTION_SNAPSHOT_MAX_ENTRIES:-1000}
      ALICIA_RAG_CONVERSATION_TTL_MINUTES: ${ALICIA_RAG_CONVERSATION_TTL_MINUTES:-30}
      ALICIA_RAG_CONVERSATION_MAX_CONVERSATIONS: ${ALICIA_RAG_CONVERSATION_MAX_CONVERSATIONS:-500}
      ALICIA_RAG_STREAM_HEARTBEAT_MILLIS: ${ALICIA_RAG_STREAM_HEARTBEAT_MILLIS:-3000}
      ALICIA_RAG_STREAM_TIMEOUT_MILLIS: ${ALICIA_RAG_STREAM_TIMEOUT_MILLIS:-60000}
      ALICIA_RAG_STREAM_PLAN_TIMEOUT_MILLIS: ${ALICIA_RAG_STREAM_PLAN_TIMEOUT_MILLIS:-35000}
      ALICIA_RAG_EXECUTION_SHADOW_REGISTRATION_ENABLED: ${ALICIA_RAG_EXECUTION_SHADOW_REGISTRATION_ENABLED:-false}
      ALICIA_RAG_EXECUTION_BASE_URL: ${ALICIA_RAG_EXECUTION_BASE_URL:-http://rag-execution:8084}
      ALICIA_RAG_EXECUTION_SERVICE_SECRET: ${ALICIA_RAG_EXECUTION_SERVICE_SECRET:-}
      ALICIA_RAG_EXECUTION_CONNECT_TIMEOUT: ${ALICIA_RAG_EXECUTION_CONNECT_TIMEOUT:-2s}
      ALICIA_RAG_EXECUTION_READ_TIMEOUT: ${ALICIA_RAG_EXECUTION_READ_TIMEOUT:-5s}
      ALICIA_RAG_EXECUTION_CONFIRMATION_TTL: ${ALICIA_RAG_EXECUTION_CONFIRMATION_TTL:-10m}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "127.0.0.1:8091:8081"
    depends_on:
      - api

  rag-execution:
    build:
      context: .
      dockerfile: ragExecution/Dockerfile
    restart: unless-stopped
    profiles: ["rag-execution-foundation"]
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${ALICIA_RAG_EXECUTION_MYSQL_DATABASE:-alicia_rag_execution}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${ALICIA_RAG_EXECUTION_DB_USERNAME:-alicia_rag_execution}
      SPRING_DATASOURCE_PASSWORD: ${ALICIA_RAG_EXECUTION_DB_PASSWORD:-CHANGE_ME}
      ALICIA_RAG_EXECUTION_ENABLED: ${ALICIA_RAG_EXECUTION_ENABLED:-false}
      ALICIA_RAG_EXECUTION_REGISTRATION_ENABLED: ${ALICIA_RAG_EXECUTION_REGISTRATION_ENABLED:-false}
      ALICIA_RAG_EXECUTION_PUBLIC_CONFIRM_ENABLED: ${ALICIA_RAG_EXECUTION_PUBLIC_CONFIRM_ENABLED:-false}
      ALICIA_RAG_EXECUTION_WORKER_ENABLED: ${ALICIA_RAG_EXECUTION_WORKER_ENABLED:-false}
      ALICIA_RAG_EXECUTION_CLOUD_DISPATCH_ENABLED: ${ALICIA_RAG_EXECUTION_CLOUD_DISPATCH_ENABLED:-false}
      ALICIA_RAG_EXECUTION_ADMIN_ONLY: ${ALICIA_RAG_EXECUTION_ADMIN_ONLY:-true}
      ALICIA_RAG_EXECUTION_ALLOWED_ACTIONS: ${ALICIA_RAG_EXECUTION_ALLOWED_ACTIONS:-}
      ALICIA_RAG_EXECUTION_SERVICE_SECRET: ${ALICIA_RAG_EXECUTION_SERVICE_SECRET:-}
      ALICIA_RAG_EXECUTION_IDENTITY_API_BASE_URL: ${ALICIA_RAG_EXECUTION_IDENTITY_API_BASE_URL:-http://identity:8082}
      ALICIA_RAG_EXECUTION_IDENTITY_CONNECT_TIMEOUT: ${ALICIA_RAG_EXECUTION_IDENTITY_CONNECT_TIMEOUT:-2s}
      ALICIA_RAG_EXECUTION_IDENTITY_READ_TIMEOUT: ${ALICIA_RAG_EXECUTION_IDENTITY_READ_TIMEOUT:-5s}
      ALICIA_RAG_EXECUTION_CLOUD_API_BASE_URL: ${ALICIA_RAG_EXECUTION_CLOUD_API_BASE_URL:-http://api:8080}
      ALICIA_RAG_EXECUTION_CLOUD_SERVICE_SECRET: ${ALICIA_RAG_EXECUTION_CLOUD_SERVICE_SECRET:-}
      ALICIA_RAG_EXECUTION_CLOUD_CONNECT_TIMEOUT: ${ALICIA_RAG_EXECUTION_CLOUD_CONNECT_TIMEOUT:-2s}
      ALICIA_RAG_EXECUTION_CLOUD_READ_TIMEOUT: ${ALICIA_RAG_EXECUTION_CLOUD_READ_TIMEOUT:-5s}
      ALICIA_RAG_EXECUTION_MAX_QUEUE_WAIT: ${ALICIA_RAG_EXECUTION_MAX_QUEUE_WAIT:-2m}
      ALICIA_RAG_EXECUTION_MAX_BATCH_NODES: ${ALICIA_RAG_EXECUTION_MAX_BATCH_NODES:-100}
      ALICIA_RAG_EXECUTION_CLIENT_INPUT_TTL: ${ALICIA_RAG_EXECUTION_CLIENT_INPUT_TTL:-15m}
      ALICIA_RAG_EXECUTION_LEASE_DURATION: ${ALICIA_RAG_EXECUTION_LEASE_DURATION:-30s}
      ALICIA_RAG_EXECUTION_MAX_ATTEMPTS: ${ALICIA_RAG_EXECUTION_MAX_ATTEMPTS:-3}
      ALICIA_RAG_EXECUTION_WORKER_POLL_DELAY: ${ALICIA_RAG_EXECUTION_WORKER_POLL_DELAY:-1s}
      ALICIA_RAG_EXECUTION_STREAM_TIMEOUT: ${ALICIA_RAG_EXECUTION_STREAM_TIMEOUT:-30s}
      ALICIA_RAG_EXECUTION_STREAM_POLL_INTERVAL: ${ALICIA_RAG_EXECUTION_STREAM_POLL_INTERVAL:-500ms}
    ports:
      - "127.0.0.1:8094:8084"
    depends_on:
      rag-execution-db-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8084'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: webApp/Dockerfile
      args:
        VITE_ANDROID_PACKAGE_NAME: ${VITE_ANDROID_PACKAGE_NAME:-com.alicia.cloudstorage.phone}
    ports:
      - "80:80"
    networks:
      - default
      - alicia_gateway
    depends_on:
      - api
      - rag

volumes:
  alicia_cloud_storage_mysql_data:
  alicia_cloud_storage_app_package_data:

networks:
  alicia_gateway:
    external: true
