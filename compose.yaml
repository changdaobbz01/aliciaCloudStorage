services:
  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      ALICIA_IDENTITY_MYSQL_DATABASE: ${ALICIA_IDENTITY_MYSQL_DATABASE:-}
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - alicia_cloud_storage_mysql_data:/var/lib/mysql
      - ./deploy/mysql/init-identity-database.sh:/docker-entrypoint-initdb.d/10-init-identity-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: CloudStorageApi/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ALICIA_IDENTITY_API_BASE_URL: ${ALICIA_IDENTITY_API_BASE_URL:-http://identity:8082}
      ALICIA_AUTH_TOKEN_ISSUER: ${ALICIA_AUTH_TOKEN_ISSUER:-https://windwindwind-alicia.cn}
      ALICIA_AUTH_TOKEN_AUDIENCE: ${ALICIA_AUTH_TOKEN_AUDIENCE:-alicia-tools}
      ALICIA_IDENTITY_TOKEN_PREFLIGHT_ENABLED: ${ALICIA_IDENTITY_TOKEN_PREFLIGHT_ENABLED:-true}
      ALICIA_IDENTITY_TOKEN_JWKS_CACHE_SECONDS: ${ALICIA_IDENTITY_TOKEN_JWKS_CACHE_SECONDS:-300}
      ALICIA_SHARE_ACCESS_TOKEN_SECRET: ${ALICIA_SHARE_ACCESS_TOKEN_SECRET:-${ALICIA_AUTH_TOKEN_SECRET:-alicia-cloud-storage-dev-secret-change-me}}
      ALICIA_COS_SECRET_ID: ${ALICIA_COS_SECRET_ID}
      ALICIA_COS_SECRET_KEY: ${ALICIA_COS_SECRET_KEY}
      ALICIA_COS_REGION: ${ALICIA_COS_REGION}
      ALICIA_COS_BUCKET: ${ALICIA_COS_BUCKET}
      ALICIA_COS_CUSTOM_DOMAIN: ${ALICIA_COS_CUSTOM_DOMAIN:-}
      ALICIA_COS_MAX_FILE_SIZE_BYTES: ${ALICIA_COS_MAX_FILE_SIZE_BYTES}
      ALICIA_STORAGE_TOTAL_SPACE_BYTES: ${ALICIA_STORAGE_TOTAL_SPACE_BYTES}
      ALICIA_STORAGE_DEFAULT_USER_QUOTA_BYTES: ${ALICIA_STORAGE_DEFAULT_USER_QUOTA_BYTES}
      ALICIA_APP_PACKAGE_STORAGE_DIR: ${ALICIA_APP_PACKAGE_STORAGE_DIR:-/app/data/app-package}
      ALICIA_APP_PACKAGE_MAX_SIZE_BYTES: ${ALICIA_APP_PACKAGE_MAX_SIZE_BYTES:-314572800}
      ALICIA_APP_PACKAGE_COS_PREFIX: ${ALICIA_APP_PACKAGE_COS_PREFIX:-app-packages}
      ALICIA_APP_PACKAGE_DOWNLOAD_URL_EXPIRE_SECONDS: ${ALICIA_APP_PACKAGE_DOWNLOAD_URL_EXPIRE_SECONDS:-1800}
      ALICIA_STORAGE_EVENTS_WEBHOOK_URL: ${ALICIA_STORAGE_EVENTS_WEBHOOK_URL:-}
      ALICIA_STORAGE_EVENTS_WEBHOOK_SECRET: ${ALICIA_STORAGE_EVENTS_WEBHOOK_SECRET:-}
      ALICIA_STORAGE_EVENTS_WEBHOOK_CONNECT_TIMEOUT_MS: ${ALICIA_STORAGE_EVENTS_WEBHOOK_CONNECT_TIMEOUT_MS:-2000}
      ALICIA_STORAGE_EVENTS_WEBHOOK_REQUEST_TIMEOUT_MS: ${ALICIA_STORAGE_EVENTS_WEBHOOK_REQUEST_TIMEOUT_MS:-5000}
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - alicia_cloud_storage_app_package_data:/app/data/app-package
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  identity:
    build:
      context: .
      dockerfile: identityApi/Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${ALICIA_IDENTITY_MYSQL_DATABASE:-${MYSQL_DATABASE}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ALICIA_AUTH_TOKEN_SECRET: ${ALICIA_AUTH_TOKEN_SECRET}
      ALICIA_AUTH_TOKEN_EXPIRE_SECONDS: ${ALICIA_AUTH_TOKEN_EXPIRE_SECONDS}
      ALICIA_AUTH_TOKEN_ISSUER: ${ALICIA_AUTH_TOKEN_ISSUER:-https://windwindwind-alicia.cn}
      ALICIA_AUTH_TOKEN_AUDIENCE: ${ALICIA_AUTH_TOKEN_AUDIENCE:-alicia-tools}
      ALICIA_AUTH_TOKEN_KEY_ID: ${ALICIA_AUTH_TOKEN_KEY_ID:-alicia-hs256-v1}
      ALICIA_AUTH_TOKEN_PREVIOUS_KEYS: ${ALICIA_AUTH_TOKEN_PREVIOUS_KEYS:-}
      ALICIA_AUTH_TOKEN_ALGORITHM: ${ALICIA_AUTH_TOKEN_ALGORITHM:-HS256}
      ALICIA_AUTH_TOKEN_RSA_PRIVATE_KEY: ${ALICIA_AUTH_TOKEN_RSA_PRIVATE_KEY:-}
      ALICIA_AUTH_TOKEN_RSA_PUBLIC_KEY: ${ALICIA_AUTH_TOKEN_RSA_PUBLIC_KEY:-}
      ALICIA_AUTH_TOKEN_PREVIOUS_RSA_PUBLIC_KEYS: ${ALICIA_AUTH_TOKEN_PREVIOUS_RSA_PUBLIC_KEYS:-}
      ALICIA_MAIL_ENABLED: ${ALICIA_MAIL_ENABLED:-false}
      ALICIA_MAIL_SMTP_HOST: ${ALICIA_MAIL_SMTP_HOST:-smtp.qcloudmail.com}
      ALICIA_MAIL_SMTP_PORT: ${ALICIA_MAIL_SMTP_PORT:-465}
      ALICIA_MAIL_SMTP_USERNAME: ${ALICIA_MAIL_SMTP_USERNAME:-}
      ALICIA_MAIL_SMTP_PASSWORD: ${ALICIA_MAIL_SMTP_PASSWORD:-}
      ALICIA_MAIL_FROM_ADDRESS: ${ALICIA_MAIL_FROM_ADDRESS:-}
      ALICIA_MAIL_FROM_NAME: ${ALICIA_MAIL_FROM_NAME:-Alicia Cloud}
      ALICIA_MAIL_SSL_ENABLED: ${ALICIA_MAIL_SSL_ENABLED:-true}
      ALICIA_BOOTSTRAP_ADMIN_PHONE: ${ALICIA_BOOTSTRAP_ADMIN_PHONE:-}
      ALICIA_BOOTSTRAP_ADMIN_PASSWORD: ${ALICIA_BOOTSTRAP_ADMIN_PASSWORD:-}
      ALICIA_BOOTSTRAP_ADMIN_NICKNAME: ${ALICIA_BOOTSTRAP_ADMIN_NICKNAME:-}
      ALICIA_BOOTSTRAP_ADMIN_AVATAR_URL: ${ALICIA_BOOTSTRAP_ADMIN_AVATAR_URL:-}
    ports:
      - "127.0.0.1:8093:8082"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      ALICIA_RAG_WEBHOOK_SECRET: ${ALICIA_RAG_WEBHOOK_SECRET:-}
      ALICIA_STORAGE_API_BASE_URL: ${ALICIA_STORAGE_API_BASE_URL:-http://api:8080}
      ALICIA_STORAGE_API_TIMEOUT_SECONDS: ${ALICIA_STORAGE_API_TIMEOUT_SECONDS:-4}
      ALICIA_RAG_CANDIDATE_BINDING_MAX_RESULTS: ${ALICIA_RAG_CANDIDATE_BINDING_MAX_RESULTS:-5}
      ALICIA_RAG_CANDIDATE_BINDING_DIRECTORY_LIST_MAX_RESULTS: ${ALICIA_RAG_CANDIDATE_BINDING_DIRECTORY_LIST_MAX_RESULTS:-50}
      ALICIA_RAG_COLLECTION_PREVIEW_MAX_ITEMS: ${ALICIA_RAG_COLLECTION_PREVIEW_MAX_ITEMS:-20}
      ALICIA_RAG_COLLECTION_PREVIEW_MAX_SCAN_ITEMS: ${ALICIA_RAG_COLLECTION_PREVIEW_MAX_SCAN_ITEMS:-500}
      ALICIA_RAG_COLLECTION_SNAPSHOT_TTL_MINUTES: ${ALICIA_RAG_COLLECTION_SNAPSHOT_TTL_MINUTES:-30}
      ALICIA_RAG_COLLECTION_SNAPSHOT_MAX_ENTRIES: ${ALICIA_RAG_COLLECTION_SNAPSHOT_MAX_ENTRIES:-1000}
      ALICIA_RAG_CONVERSATION_TTL_MINUTES: ${ALICIA_RAG_CONVERSATION_TTL_MINUTES:-30}
      ALICIA_RAG_CONVERSATION_MAX_CONVERSATIONS: ${ALICIA_RAG_CONVERSATION_MAX_CONVERSATIONS:-500}
      ALICIA_RAG_STREAM_HEARTBEAT_MILLIS: ${ALICIA_RAG_STREAM_HEARTBEAT_MILLIS:-3000}
      ALICIA_RAG_STREAM_TIMEOUT_MILLIS: ${ALICIA_RAG_STREAM_TIMEOUT_MILLIS:-60000}
      ALICIA_RAG_STREAM_PLAN_TIMEOUT_MILLIS: ${ALICIA_RAG_STREAM_PLAN_TIMEOUT_MILLIS:-35000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "127.0.0.1:8091:8081"
    depends_on:
      - api

  frontend:
    build:
      context: ./webApp
    ports:
      - "80:80"
    networks:
      - default
      - alicia_gateway
    depends_on:
      - api
      - identity
      - rag

volumes:
  alicia_cloud_storage_mysql_data:
  alicia_cloud_storage_app_package_data:

networks:
  alicia_gateway:
    external: true
